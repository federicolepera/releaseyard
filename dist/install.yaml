apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: idp
    control-plane: controller-manager
  name: idp-controller-manager-metrics-service
  namespace: idp-system
spec:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  selector:
    app.kubernetes.io/name: idp
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: idp
    control-plane: controller-manager
  name: idp-controller-manager
  namespace: idp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: idp
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: idp
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --metrics-bind-address=:8443
        - --leader-elect
        - --health-probe-bind-address=:8081
        command:
        - /manager
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: controller:latest
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts: []
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: idp-controller-manager
      terminationGracePeriodSeconds: 10
      volumes: []
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  labels:
    app.kubernetes.io/component: admission
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: idp
  name: idp-application-access-policy
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - platform.releaseyard.io
      apiVersions:
      - v1alpha1
      operations:
      - CREATE
      resources:
      - applications
      scope: Namespaced
  validations:
  - expression: authorizer.group('platform.releaseyard.io').resource('applicationdefinitions').name(object.spec.applicationDefinitionRef.name).check('get').allowed()
    message: The referenced ApplicationDefinition must be readable by the requesting
      user.
    reason: Forbidden
  - expression: '!has(object.spec.clusterRef) || authorizer.group(''platform.releaseyard.io'').resource(''clusters'').name(object.spec.clusterRef.name).check(''get'').allowed()'
    message: The referenced Cluster must be readable by the requesting user.
    reason: Forbidden
  - expression: '!has(object.spec.clusters) || object.spec.clusters.all(target, authorizer.group(''platform.releaseyard.io'').resource(''clusters'').name(target.name).check(''get'').allowed())'
    message: Every selected Cluster must be readable by the requesting user.
    reason: Forbidden
  - expression: '!has(object.spec.environment) || !has(object.spec.environment.targets)
      || object.spec.environment.targets.all(target, authorizer.group(''platform.releaseyard.io'').resource(''clusters'').name(target.name).check(''get'').allowed())'
    message: Every environment target Cluster must be readable by the requesting user.
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  labels:
    app.kubernetes.io/component: admission
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: idp
  name: idp-application-placement-policy
spec:
  failurePolicy: Fail
  matchConditions:
  - expression: has(object.spec.clusters) && (!has(oldObject.spec.clusters) || object.spec.clusters
      != oldObject.spec.clusters)
    name: clusters-changed
  matchConstraints:
    resourceRules:
    - apiGroups:
      - platform.releaseyard.io
      apiVersions:
      - v1alpha1
      operations:
      - UPDATE
      resources:
      - applications
      scope: Namespaced
  validations:
  - expression: object.spec.clusters.all(target, (has(oldObject.spec.clusters) &&
      oldObject.spec.clusters.exists(old, old.name == target.name && old.uid == target.uid))
      || authorizer.group('platform.releaseyard.io').resource('clusters').name(target.name).check('get').allowed())
    message: Every added Cluster must be readable by the requesting user.
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  labels:
    app.kubernetes.io/component: admission
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: idp
  name: idp-application-access-binding
spec:
  policyName: idp-application-access-policy
  validationActions:
  - Deny
---
