## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  replicas: 1

  image:
    repository: controller
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## Arguments
  ##
  args:
    - --leader-elect

  ## Comma-separated chart repository hosts the manager may fetch from.
  ## When empty the binary default (127.0.0.1:18080) is used. For an in-cluster
  ## ChartMuseum, set this to its Service authority, for example
  ## chartmuseum.chartmuseum.svc.cluster.local:8080.
  ##
  allowedChartHosts: ""

  ## Namespace prefix stripped from an Application namespace to derive its team
  ## token, used to build collision-free workload Helm release names.
  ##
  teamNamespacePrefix: "releaseyard-team-"

  ## Health probes.
  ## The manager serves the liveness (/healthz) and readiness (/readyz) endpoints on this port.
  ##
  healthProbe:
    # Health probe server port
    port: 8081

  ## Environment variables
  ##
  env:
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace

  ## Env overrides (--set manager.envOverrides.VAR=value)
  ## Same name in env above: this value takes precedence.
  ##
  envOverrides: {}

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints
  ##
  # topologySpreadConstraints: []

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## RBAC configuration
##
rbac:
  ## RBAC resource scope
  ## - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  ## - true: Role/RoleBinding (release namespace only)
  ##
  namespaced: false

  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for CRDs
    ##
    enabled: false

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  ## Existing ServiceAccount name (required when enabled=false)
  ## Set to "default" to use the namespace default ServiceAccount
  ## Note: When enabled=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enabled: false

## Webhook server configuration
##
webhook:
  enabled: false
  # Webhook server port
  port: 9443

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enabled: false

  ## Custom ServiceMonitor labels
  ##
  # labels: {}

  ## Custom ServiceMonitor annotations
  ##
  # annotations: {}

## Network policies for controlling traffic flow.
## Enable to restrict ingress to the controller manager.
##
networkPolicy:
  enabled: false


## Optional dashboard. Disabled by default.
##
## A fresh installation authenticates with the built-in administrator: the
## bootstrap Job creates a Secret holding a generated password. OIDC is
## configured later from the Administration page (not through values).
dashboard:
  enabled: false

  ## Namespace prefix used to derive per-team namespaces from identity-provider
  ## groups for multi-team Application placement.
  ##
  teamNamespacePrefix: "releaseyard-team-"

  image:
    ## Required when dashboard.enabled=true.
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent

  ## Public base URL of the dashboard, such as https://dashboard.example.com or
  ## http://dashboard.localhost:18080 for local development. Required when
  ## dashboard.enabled=true. HTTP is allowed only for localhost hosts.
  publicURL: ""

  bootstrap:
    ## Create the local administrator Secret on install and upgrade when the
    ## dashboard is enabled. The Secret is never overwritten once it exists.
    enabled: true

  ## Development-only reachability to an identity provider that is exposed only
  ## on a localhost hostname (for example Keycloak behind a local Traefik).
  ## When enabled, the dashboard Pod gets hostAliases pointing the given
  ## hostnames at `hostAliasIP`. Point it at the in-cluster ingress ClusterIP and
  ## disable the sidecar, or keep 127.0.0.1 and run the socat-style sidecar that
  ## forwards the listen port to the target service inside the cluster. Never
  ## enable this in production.
  oidcLoopback:
    enabled: false
    ## Hostnames resolved inside the Pod through hostAliases.
    hostnames:
      - keycloak.localhost
    ## IP the hostnames resolve to inside the Pod. Use the in-cluster ingress
    ## (its ClusterIP) to reach it directly, or keep 127.0.0.1 with the sidecar.
    hostAliasIP: 127.0.0.1
    ## Port the identity provider issuer URL uses.
    listenPort: 18080
    ## Optional socat-style TCP bridge. Required only when hostAliasIP is
    ## 127.0.0.1 and listenPort is not served inside the cluster already.
    sidecar:
      enabled: true
      image:
        ## Required when dashboard.oidcLoopback.sidecar.enabled=true.
        repository: ""
        tag: ""
        pullPolicy: IfNotPresent
      ## Upstream address the sidecar forwards to, reachable from the cluster.
      targetHost: ""
      targetPort: 8080

  ingress:
    ## Keep disabled unless HTTPS termination is configured.
    enabled: false
    className: ""
    host: ""
    tls:
      secretName: ""
