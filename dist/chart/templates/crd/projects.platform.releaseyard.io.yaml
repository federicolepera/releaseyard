{{- if .Values.crd.enabled }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: projects.platform.releaseyard.io
spec:
  group: platform.releaseyard.io
  names:
    kind: Project
    listKind: ProjectList
    plural: projects
    singular: project
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Project is the Schema for the projects API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Project
            properties:
              catalog:
                description: |-
                  catalog lists the platform catalog entries available to members of this
                  Project. An empty list means no catalog entries are available.
                properties:
                  applicationDefinitions:
                    description: applicationDefinitions are the ApplicationDefinition
                      names available to the Project.
                    items:
                      type: string
                    maxItems: 256
                    type: array
                    x-kubernetes-list-type: set
                  cloudTargets:
                    description: cloudTargets are the CloudTarget names available
                      to the Project.
                    items:
                      type: string
                    maxItems: 256
                    type: array
                    x-kubernetes-list-type: set
                  clusters:
                    description: clusters are the Cluster names available to the Project.
                    items:
                      type: string
                    maxItems: 256
                    type: array
                    x-kubernetes-list-type: set
                  resourceDefinitions:
                    description: resourceDefinitions are the ResourceDefinition names
                      available to the Project.
                    items:
                      type: string
                    maxItems: 256
                    type: array
                    x-kubernetes-list-type: set
                type: object
              delivery:
                default:
                  mode: direct
                description: delivery controls how Applications for this Project may
                  be created.
                properties:
                  mode:
                    default: direct
                    description: mode is direct, gitops, or both.
                    enum:
                    - direct
                    - gitops
                    - both
                    type: string
                type: object
              description:
                description: description is attached to the provisioned repository.
                maxLength: 280
                type: string
              namespace:
                description: |-
                  namespace is the Kubernetes namespace that owns this Project's Applications,
                  ApplicationRequests, Resources and RBAC. It must be unique across Projects.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
                x-kubernetes-validations:
                - message: namespace is immutable
                  rule: self == oldSelf
              repository:
                description: repository defines the repository to create and its connection.
                properties:
                  connectionRef:
                    description: connectionRef identifies the GitConnection used to
                      provision this project.
                    properties:
                      name:
                        description: name is the name of the referenced GitConnection.
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        description: |-
                          namespace is the GitConnection namespace. It defaults to the manager
                          credentials namespace when empty.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                    required:
                    - name
                    type: object
                    x-kubernetes-validations:
                    - message: connection reference is immutable
                      rule: self == oldSelf
                  name:
                    description: name is the repository name. It defaults to the Project
                      name when empty.
                    maxLength: 100
                    minLength: 1
                    pattern: ^[A-Za-z0-9](?:[A-Za-z0-9._-]*[A-Za-z0-9])?$
                    type: string
                    x-kubernetes-validations:
                    - message: repository name is immutable
                      rule: self == oldSelf
                required:
                - connectionRef
                type: object
            required:
            - namespace
            - repository
            type: object
          status:
            description: status defines the observed state of Project
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the Project resource. The
                  NamespaceReady condition indicates whether the Project namespace exists and
                  is owned by the Project. The RepositoryReady condition indicates whether the
                  GitHub repository has been provisioned and verified.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              provisioning:
                description: provisioning records the durable checkpoint used to make
                  repository creation fail closed.
                properties:
                  attempted:
                    description: attempted is true once a repository-creation POST
                      may have been sent.
                    type: boolean
                  connectionUID:
                    description: connectionUID is the UID of the GitConnection used
                      for the attempt.
                    type: string
                  owner:
                    description: owner is the target provider owner.
                    type: string
                  repo:
                    description: repo is the target repository name.
                    type: string
                  repositoryID:
                    description: repositoryID is the stable provider repository ID,
                      once known.
                    format: int64
                    type: integer
                  retryAfter:
                    description: |-
                      retryAfter prevents a status change from triggering an immediate retry
                      after a definite provider rejection.
                    format: date-time
                    type: string
                type: object
              repository:
                description: repository identifies the Git repository created for
                  this Project.
                properties:
                  cloneURL:
                    description: cloneURL is the HTTPS clone URL.
                    type: string
                  defaultBranch:
                    description: defaultBranch is the repository default branch.
                    type: string
                  fullName:
                    description: fullName is the owner/name repository identifier.
                    type: string
                  id:
                    description: id is the stable provider repository ID.
                    format: int64
                    type: integer
                  name:
                    description: name is the repository name.
                    type: string
                  owner:
                    description: owner is the provider account that owns the repository.
                    type: string
                  sshURL:
                    description: sshURL is the SSH clone URL.
                    type: string
                  url:
                    description: url is the canonical web URL.
                    type: string
                required:
                - cloneURL
                - defaultBranch
                - id
                - name
                - owner
                - sshURL
                - url
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
