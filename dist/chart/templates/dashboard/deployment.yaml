{{- if .Values.dashboard.enabled }}
{{- $imageRepository := required "dashboard.image.repository is required when dashboard.enabled=true" .Values.dashboard.image.repository }}
{{- $imageTag := required "dashboard.image.tag is required when dashboard.enabled=true" .Values.dashboard.image.tag }}
{{- $pullPolicy := required "dashboard.image.pullPolicy is required when dashboard.enabled=true" .Values.dashboard.image.pullPolicy }}
{{- $publicURL := required "dashboard.publicURL is required when dashboard.enabled=true" .Values.dashboard.publicURL }}
{{- $localAdminSecretName := include "idp.resourceName" (dict "suffix" "dashboard-local-admin" "context" .) }}
{{- $sessionStore := .Values.dashboard.sessionStore | default dict }}
{{- $sessionStoreType := default "memory" $sessionStore.type }}
{{- if not (has $sessionStoreType (list "memory" "redis")) }}
{{- fail "dashboard.sessionStore.type must be memory or redis" }}
{{- end }}
{{- $replicas := int (default 1 .Values.dashboard.replicas) }}
{{- if and (gt $replicas 1) (ne $sessionStoreType "redis") }}
{{- fail "dashboard.replicas > 1 requires dashboard.sessionStore.type=redis" }}
{{- end }}
{{- $redis := $sessionStore.redis | default dict }}
{{- if eq $sessionStoreType "redis" }}
{{- $_ := required "dashboard.sessionStore.redis.address is required when type=redis" $redis.address }}
{{- end }}
{{- $loopback := .Values.dashboard.oidcLoopback }}
{{- $loopbackSidecar := $loopback.sidecar | default dict }}
{{- $loopbackSidecarEnabled := and $loopback.enabled (dig "sidecar" "enabled" true $loopback) }}
{{- $loopbackRepo := "" }}
{{- $loopbackTag := "" }}
{{- $loopbackTarget := "" }}
{{- if $loopbackSidecarEnabled }}
{{- $loopbackRepo = required "dashboard.oidcLoopback.sidecar.image.repository is required when dashboard.oidcLoopback.sidecar.enabled=true" $loopbackSidecar.image.repository }}
{{- $loopbackTag = required "dashboard.oidcLoopback.sidecar.image.tag is required when dashboard.oidcLoopback.sidecar.enabled=true" $loopbackSidecar.image.tag }}
{{- $loopbackTarget = required "dashboard.oidcLoopback.sidecar.targetHost is required when dashboard.oidcLoopback.sidecar.enabled=true" $loopbackSidecar.targetHost }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "idp.resourceName" (dict "suffix" "dashboard" "context" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "idp.resourceName" (dict "suffix" "dashboard" "context" .) }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "idp.resourceName" (dict "suffix" "dashboard" "context" .) }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "idp.resourceName" (dict "suffix" "dashboard" "context" .) }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "idp.resourceName" (dict "suffix" "dashboard" "context" .) }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- if $loopback.enabled }}
      hostAliases:
        {{- range $loopback.hostnames }}
        - ip: {{ $loopback.hostAliasIP | default "127.0.0.1" | quote }}
          hostnames:
            - {{ . | quote }}
        {{- end }}
      {{- end }}
      containers:
        - name: dashboard
          image: {{ printf "%s:%s" $imageRepository $imageTag | quote }}
          imagePullPolicy: {{ $pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DASHBOARD_PUBLIC_URL
              value: {{ $publicURL | quote }}
            - name: LOCAL_ADMIN_HASH_PATH
              value: /etc/dashboard/local-admin/password-hash
            - name: IDENTITY_PROVIDER_SECRET_NAME
              value: {{ include "idp.resourceName" (dict "suffix" "dashboard-identity-provider" "context" .) | quote }}
            - name: TEAM_NAMESPACE_PREFIX
              value: {{ .Values.dashboard.teamNamespacePrefix | quote }}
            - name: APPLICATION_EDITOR_ROLE
              value: {{ include "idp.resourceName" (dict "suffix" "application-editor-role" "context" .) | quote }}
            - name: SESSION_STORE
              value: {{ $sessionStoreType | quote }}
            {{- if eq $sessionStoreType "redis" }}
            - name: REDIS_ADDR
              value: {{ $redis.address | quote }}
            - name: REDIS_DB
              value: {{ default 0 $redis.db | quote }}
            - name: REDIS_KEY_PREFIX
              value: {{ default "releaseyard:dashboard:" $redis.keyPrefix | quote }}
            {{- if $redis.username }}
            - name: REDIS_USERNAME
              value: {{ $redis.username | quote }}
            {{- end }}
            {{- $redisPasswordSecret := $redis.passwordSecret | default dict }}
            {{- if $redisPasswordSecret.name }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $redisPasswordSecret.name | quote }}
                  key: {{ default "password" $redisPasswordSecret.key | quote }}
            {{- end }}
            {{- if dig "tls" "enabled" false $redis }}
            - name: REDIS_TLS_ENABLED
              value: "true"
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: local-admin
              mountPath: /etc/dashboard/local-admin
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        {{- if $loopbackSidecarEnabled }}
        - name: oidc-loopback
          image: {{ printf "%s:%s" $loopbackRepo $loopbackTag | quote }}
          imagePullPolicy: {{ $loopbackSidecar.image.pullPolicy }}
          args:
            - "TCP-LISTEN:{{ $loopback.listenPort }},bind=127.0.0.1,reuseaddr,fork"
            - "TCP:{{ $loopbackTarget }}:{{ $loopbackSidecar.targetPort }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        {{- end }}
      volumes:
        - name: local-admin
          secret:
            secretName: {{ $localAdminSecretName }}
            optional: true
            items:
              - key: password-hash
                path: password-hash
{{- end }}
