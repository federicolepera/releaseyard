{{- if and .Values.dashboard.enabled .Values.dashboard.ingress.enabled }}
{{- $className := required "dashboard.ingress.className is required when dashboard.ingress.enabled=true" .Values.dashboard.ingress.className }}
{{- $host := required "dashboard.ingress.host is required when dashboard.ingress.enabled=true" .Values.dashboard.ingress.host }}
{{- $tlsSecretName := required "dashboard.ingress.tls.secretName is required when dashboard.ingress.enabled=true" .Values.dashboard.ingress.tls.secretName }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "idp.resourceName" (dict "suffix" "dashboard" "context" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "idp.resourceName" (dict "suffix" "dashboard" "context" .) }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  ingressClassName: {{ $className | quote }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ $tlsSecretName | quote }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "idp.resourceName" (dict "suffix" "dashboard" "context" .) }}
                port:
                  number: 8080
{{- end }}
