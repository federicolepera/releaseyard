{{- if .Values.dashboard.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "idp.resourceName" (dict "suffix" "dashboard" "context" $) }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - platform.releaseyard.io
    resources:
      - applications
      - applicationrequests
    verbs:
      - get
      - list
      - create
      - update
      - delete
  - apiGroups:
      - platform.releaseyard.io
    resources:
      - resources
    verbs:
      - get
      - list
      - create
      - update
      - delete
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - {{ include "idp.resourceName" (dict "suffix" "dashboard-identity-provider" "context" $) }}
    verbs:
      - get
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  # The dashboard reads the managed clusters' kubeconfig Secrets to show live
  # resources, logs and metrics for the Applications a user can see. This grants
  # read access to every Secret in the release namespace; in production use a
  # dedicated namespace and a read-only credential.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "idp.resourceName" (dict "suffix" "dashboard" "context" $) }}
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "idp.resourceName" (dict "suffix" "dashboard" "context" $) }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "idp.resourceName" (dict "suffix" "dashboard" "context" $) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "idp.resourceName" (dict "suffix" "dashboard" "context" $) }}
rules:
  - apiGroups:
      - platform.releaseyard.io
    resources:
      - clusters
    verbs:
      - get
      - list
      - patch
  - apiGroups:
      - platform.releaseyard.io
    resources:
      - applicationdefinitions
      - projects
    verbs:
      - get
      - list
  # The local administrator creates direct Applications in Project namespaces.
  - apiGroups:
      - platform.releaseyard.io
    resources:
      - applications
      - resources
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
  # The local administrator creates GitOps requests in the selected Project
  # namespace. OIDC users use impersonation and their own namespace RBAC.
  - apiGroups:
      - platform.releaseyard.io
    resources:
      - applicationrequests
    verbs:
      - get
      - list
      - create
  - apiGroups:
      - platform.releaseyard.io
    resources:
      - cloudtargets
      - resourcedefinitions
    verbs:
      - get
      - list
  # The dashboard detects whether Crossplane is installed by reading its CRDs.
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
  # The dashboard manages access ClusterRoles and bindings on behalf of the
  # local administrator (Administration panel).
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
      - clusterrolebindings
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
  # The dashboard provisions per-team namespaces and binds the team group to the
  # helper editor ClusterRole on behalf of the local administrator ("Access
  # applications" panel). Binding a role requires the "bind" verb on it.
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - create
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
    resourceNames:
      - {{ include "idp.resourceName" (dict "suffix" "application-editor-role" "context" $) }}
    verbs:
      - bind
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
    resourceNames:
      - {{ include "idp.resourceName" (dict "suffix" "project-viewer" "context" $) }}
      - {{ include "idp.resourceName" (dict "suffix" "project-developer" "context" $) }}
      - {{ include "idp.resourceName" (dict "suffix" "project-requester" "context" $) }}
      - {{ include "idp.resourceName" (dict "suffix" "project-admin" "context" $) }}
      - {{ include "idp.resourceName" (dict "suffix" "platform-admin" "context" $) }}
    verbs:
      - bind
  # The dashboard reads Events to render an object's Activity. Events live in the
  # object's namespace (including per-team namespaces), so this must be
  # cluster-wide; visibility still follows the object read permission above.
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
  # The dashboard impersonates the logged-in user so the management cluster's
  # RBAC authorizes writes. Impersonation is powerful: consider restricting it
  # with resourceNames or constrained impersonation in production.
  - apiGroups:
      - ""
    resources:
      - users
      - groups
    verbs:
      - impersonate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "idp.resourceName" (dict "suffix" "dashboard" "context" $) }}
subjects:
  - kind: ServiceAccount
    name: {{ include "idp.resourceName" (dict "suffix" "dashboard" "context" $) }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "idp.resourceName" (dict "suffix" "dashboard" "context" $) }}
{{- end }}
