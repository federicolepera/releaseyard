apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "idp.resourceName" (dict "suffix" "manager-credentials-reader" "context" $) }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "idp.resourceName" (dict "suffix" "manager-credentials-reader" "context" $) }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "idp.resourceName" (dict "suffix" "manager-credentials-reader" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "idp.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
