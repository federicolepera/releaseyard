{{- if .Values.rbac.helpers.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "idp.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "idp.resourceName" (dict "suffix" "dashboard-admin-role" "context" $) }}
rules:
  # Managing the ClusterRoles/ClusterRoleBindings behind Access definitions and
  # Cluster access. Requiring "create" on clusterrolebindings is what makes an
  # OIDC user a dashboard administrator.
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
      - clusterrolebindings
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
  # Access applications provisions per-team namespaces and RoleBindings.
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - create
  # Reading the catalog, clusters and cloud catalog the panels list.
  - apiGroups:
      - platform.releaseyard.io
    resources:
      - clusters
      - applicationdefinitions
      - cloudtargets
      - resourcedefinitions
    verbs:
      - get
      - list
  # Platform administrators can manage cloud resources from the dashboard.
  - apiGroups:
      - platform.releaseyard.io
    resources:
      - resources
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
{{- range .Values.dashboard.adminGroups }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/name: {{ include "idp.name" $ }}
    helm.sh/chart: {{ $.Chart.Name }}-{{ $.Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  name: {{ include "idp.resourceName" (dict "suffix" (printf "dashboard-admin-%s" (sha256sum . | trunc 8)) "context" $) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "idp.resourceName" (dict "suffix" "dashboard-admin-role" "context" $) }}
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ . }}
{{- end }}
{{- end }}
