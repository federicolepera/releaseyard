apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "idp.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - platform.releaseyard.io
  resources:
  - applicationdefinitions
  - clusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - platform.releaseyard.io
  resources:
  - applicationdefinitions/status
  - applications/status
  - clusters/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - platform.releaseyard.io
  resources:
  - applications
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - platform.releaseyard.io
  resources:
  - applications/finalizers
  verbs:
  - update
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
