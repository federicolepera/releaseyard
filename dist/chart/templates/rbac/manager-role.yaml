{{- if .Values.rbac.namespaced }}
{{- fail "rbac.namespaced=true is not supported: the Project controller requires cluster-scoped permissions" }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "idp.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - argoproj.io
  resources:
  - applications
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - platform.releaseyard.io
  resources:
  - applicationdefinitions
  - applicationrequests
  - cloudtargets
  - clusters
  - resourcedefinitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - platform.releaseyard.io
  resources:
  - projects
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - platform.releaseyard.io
  resources:
  - gitconnections
  verbs:
  - get
- apiGroups:
  - platform.releaseyard.io
  resources:
  - applicationdefinitions/status
  - applicationrequests/status
  - applications/status
  - clusters/status
  - projects/status
  - resources/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - platform.releaseyard.io
  resources:
  - applications
  - resources
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - platform.releaseyard.io
  resources:
  - applications/finalizers
  - resources/finalizers
  verbs:
  - update
- apiGroups:
  - s3.aws.m.upbound.io
  resources:
  - buckets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
