{{- if .Values.rbac.helpers.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "idp.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "idp.resourceName" (dict "suffix" "project-requester" "context" $) }}
rules:
  - apiGroups:
      - platform.releaseyard.io
    resources:
      - applications
      - applicationrequests
      - resources
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - platform.releaseyard.io
    resources:
      - applicationrequests
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
{{- end }}
