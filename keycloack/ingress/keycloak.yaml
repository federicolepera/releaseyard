apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: releaseyard-keycloak
  namespace: keycloak-operator
spec:
  ingressClassName: traefik
  rules:
    - host: keycloak.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: releaseyard-keycloak-service
                port:
                  number: 8080
