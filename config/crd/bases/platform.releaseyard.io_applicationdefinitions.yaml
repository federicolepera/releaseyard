---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: applicationdefinitions.platform.releaseyard.io
spec:
  group: platform.releaseyard.io
  names:
    kind: ApplicationDefinition
    listKind: ApplicationDefinitionList
    plural: applicationdefinitions
    singular: applicationdefinition
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ApplicationDefinition is the cluster-scoped management-cluster contract for an application chart.
          spec.release.namespace identifies the target namespace on a workload cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ApplicationDefinition
            properties:
              chart:
                description: chart identifies the Helm chart used by Applications
                  consuming this definition.
                properties:
                  name:
                    description: name is the chart name.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  repository:
                    description: repository is the base URL of an HTTP(S) Helm repository.
                    minLength: 8
                    pattern: ^https?://.+$
                    type: string
                  version:
                    description: version is a pinned semantic version. Floating tags
                      such as "latest" are not accepted.
                    minLength: 5
                    pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$
                    type: string
                required:
                - name
                - repository
                - version
                type: object
              configurableValues:
                description: |-
                  configurableValues lists the only chart value paths an Application may eventually set.
                  Application validation and Helm operations are future work.
                items:
                  description: ApplicationDefinitionValue exposes one developer-configurable
                    chart value path.
                  properties:
                    maximum:
                      description: maximum is an inclusive upper bound for integer
                        values.
                      format: int64
                      type: integer
                    minimum:
                      description: minimum is an inclusive lower bound for integer
                        values.
                      format: int64
                      type: integer
                    path:
                      description: path is a dot-separated path; dots have no escaping
                        syntax.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[A-Za-z][A-Za-z0-9_-]*(\.[A-Za-z][A-Za-z0-9_-]*)*$
                      type: string
                    required:
                      default: false
                      description: required indicates whether an Application must
                        supply this value. It defaults to false.
                      type: boolean
                    type:
                      description: type is the value type exposed to an Application.
                      enum:
                      - string
                      - integer
                      - boolean
                      type: string
                  required:
                  - path
                  - type
                  type: object
                  x-kubernetes-validations:
                  - message: minimum is only valid for integer values
                    rule: '!has(self.minimum) || self.type == ''integer'''
                  - message: maximum is only valid for integer values
                    rule: '!has(self.maximum) || self.type == ''integer'''
                  - message: minimum must not exceed maximum
                    rule: '!has(self.minimum) || !has(self.maximum) || self.minimum
                      <= self.maximum'
                type: array
                x-kubernetes-list-map-keys:
                - path
                x-kubernetes-list-type: map
              defaults:
                description: |-
                  defaults is an optional arbitrary nested Helm values object.
                  Application value validation and Helm operations are future work; this API only stores the contract.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              description:
                description: |-
                  description is a short human-readable summary of the definition, shown in
                  the catalog and in the access definitions picker.
                maxLength: 280
                type: string
              release:
                description: |-
                  release configures the target workload cluster namespace and release naming convention.
                  The eventual Helm release name is the consuming Application's metadata.name.
                properties:
                  allowNamespaceOverride:
                    default: false
                    description: allowNamespaceOverride permits Applications to select
                      a different existing target namespace.
                    type: boolean
                  namespace:
                    description: |-
                      namespace is created/used on the target workload cluster, not in the management cluster.
                      It is immutable after the ApplicationDefinition is created.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                    x-kubernetes-validations:
                    - message: release namespace is immutable
                      rule: self == oldSelf
                required:
                - namespace
                type: object
            required:
            - chart
            - release
            type: object
          status:
            description: status defines the observed state of ApplicationDefinition
            properties:
              conditions:
                description: conditions represent the current validation and chart-verification
                  state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              digest:
                description: digest is the SHA-256 digest of the downloaded chart
                  archive bytes.
                type: string
              lastCheckedTime:
                description: lastCheckedTime is when the current generation was last
                  checked.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the generation used for the current
                  status.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
