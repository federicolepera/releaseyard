apiVersion: v1
kind: ServiceAccount
metadata:
  name: releaseyard-dashboard
  namespace: idp-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: releaseyard-dashboard
  namespace: idp-system
rules:
  - apiGroups: [platform.releaseyard.io]
    resources: [applicationdefinitions]
    verbs: [get, list]
  - apiGroups: [platform.releaseyard.io]
    resources: [applications]
    verbs: [get, list, create, update, delete]
  - apiGroups: [platform.releaseyard.io]
    resources: [resources]
    verbs: [get, list, create, update, delete]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [releaseyard-dashboard-identity-provider]
    verbs: [get, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: releaseyard-dashboard
  namespace: idp-system
subjects:
  - kind: ServiceAccount
    name: releaseyard-dashboard
    namespace: idp-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: releaseyard-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: releaseyard-dashboard
rules:
  - apiGroups: [platform.releaseyard.io]
    resources: [clusters]
    verbs: [get, list, patch]
  - apiGroups: [platform.releaseyard.io]
    resources: [cloudtargets, resourcedefinitions]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [users, groups]
    verbs: [impersonate]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: releaseyard-dashboard
subjects:
  - kind: ServiceAccount
    name: releaseyard-dashboard
    namespace: idp-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: releaseyard-dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: releaseyard-dashboard
  namespace: idp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: releaseyard-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: releaseyard-dashboard
    spec:
      serviceAccountName: releaseyard-dashboard
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: releaseyard-dashboard:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DASHBOARD_PUBLIC_URL
              value: http://127.0.0.1:8080
            - name: LOCAL_ADMIN_HASH_PATH
              value: /etc/dashboard/local-admin/password-hash
            - name: IDENTITY_PROVIDER_SECRET_NAME
              value: releaseyard-dashboard-identity-provider
          volumeMounts:
            - name: local-admin
              mountPath: /etc/dashboard/local-admin
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: local-admin
          secret:
            secretName: releaseyard-dashboard-local-admin
            optional: true
            items:
              - key: password-hash
                path: password-hash
---
apiVersion: v1
kind: Service
metadata:
  name: releaseyard-dashboard
  namespace: idp-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: releaseyard-dashboard
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
