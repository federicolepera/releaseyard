apiVersion: platform.releaseyard.io/v1alpha1
kind: Project
metadata:
  labels:
    app.kubernetes.io/name: idp
    app.kubernetes.io/managed-by: kustomize
  name: project-sample
spec:
  namespace: releaseyard-team-project-sample
  repository:
    name: project-sample
    connectionRef:
      name: acme
      namespace: idp-system
  description: Repository del progetto esempio
  delivery:
    mode: both
  catalog:
    applicationDefinitions:
      - applicationdefinition-sample
    clusters:
      - releaseyard-managed-a
      - releaseyard-managed-b
    cloudTargets:
      - localstack
    resourceDefinitions:
      - aws-bucket
