# This rule is not used by the project idp itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over platform.releaseyard.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: idp
    app.kubernetes.io/managed-by: kustomize
  name: resourcedefinition-admin-role
rules:
- apiGroups:
  - platform.releaseyard.io
  resources:
  - resourcedefinitions
  verbs:
  - '*'
- apiGroups:
  - platform.releaseyard.io
  resources:
  - resourcedefinitions/status
  verbs:
  - get
