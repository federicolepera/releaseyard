apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: idp-
resources:
  - application-project-policy.yaml
  - application-project-binding.yaml
replacements:
  - source:
      kind: ValidatingAdmissionPolicy
      name: application-project-policy
      fieldPath: metadata.name
    targets:
      - select:
          kind: ValidatingAdmissionPolicyBinding
          name: application-project-binding
        fieldPaths:
          - spec.policyName
