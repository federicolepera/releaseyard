apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: application-placement-policy
  labels:
    app.kubernetes.io/name: idp
    app.kubernetes.io/component: admission
    app.kubernetes.io/managed-by: kustomize
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - platform.releaseyard.io
        apiVersions:
          - v1alpha1
        operations:
          - UPDATE
        resources:
          - applications
        scope: Namespaced
  matchConditions:
    - name: clusters-changed
      expression: >-
        has(object.spec.clusters) && (!has(oldObject.spec.clusters) || object.spec.clusters != oldObject.spec.clusters)
  validations:
    - expression: >-
        object.spec.clusters.all(target, (has(oldObject.spec.clusters) && oldObject.spec.clusters.exists(old, old.name == target.name && old.uid == target.uid)) || authorizer.group('platform.releaseyard.io').resource('clusters').name(target.name).check('get').allowed())
      message: Every added Cluster must be readable by the requesting user.
      reason: Forbidden
