apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: application-project-policy
  labels:
    app.kubernetes.io/name: idp
    app.kubernetes.io/component: admission
    app.kubernetes.io/managed-by: kustomize
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - platform.releaseyard.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
        resources:
          - applications
          - applicationrequests
        scope: Namespaced
  validations:
    - expression: >-
        namespaceObject != null &&
        has(namespaceObject.metadata.labels) &&
        'platform.releaseyard.io/project' in namespaceObject.metadata.labels &&
        namespaceObject.metadata.labels['platform.releaseyard.io/project'] != ''
      message: Applications and ApplicationRequests can only be created in a Project namespace.
      reason: Forbidden
