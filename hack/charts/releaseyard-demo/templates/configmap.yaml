apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-page
  labels:
    app.kubernetes.io/name: releaseyard-demo
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  index.html: {{ printf "<!doctype html><html><head><meta charset=\"utf-8\"><title>ReleaseYard Demo</title></head><body><h1>%s</h1></body></html>\n" (.Values.message | replace "&" "&amp;" | replace "<" "&lt;" | replace ">" "&gt;" | replace "\"" "&quot;" | replace "'" "&#39;") | toJson }}
