apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: releaseyard-demo
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: releaseyard-demo
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: primary
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
